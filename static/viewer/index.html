<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEML Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Colour and font tokens, shared by <teml-board> (:host) and the pages around it (:root). */
  :root, :host {
    --page: #f3f5f7;
    --ink: #1b2128;
    --muted: #5b6573;
    --line: #d4d9df;
    --board: #fbfcfd;
    --dot: #dde2e7;
    --lane-alt: rgba(27, 33, 40, 0.025);
    --label-bg: #f0f3f6;
    --surface: #ffffff;
    --arrow: #7a8491;
    --hot: #1b2128;
    --focus: #2f6db0;
    --note-ink: #1b2027;
    --cmd: #86bdf2;
    --evt: #f7ab5e;
    --view: #93d494;
    --screen: #ffffff;
    --screen-edge: #98a2ae;
    --automation: #d3cbf1;
    --sys: #dbe9ec;
    --sys-edge: #6f8e96;
    --err: #c8423b;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --cond: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]), :host(:not([theme="light"])) {
      color-scheme: dark;
      --page: #111418; --ink: #e5e9ee; --muted: #98a2ae; --line: #2a3138;
      --board: #171b20; --dot: #262d35; --lane-alt: rgba(229, 233, 238, 0.025); --label-bg: #1c2127;
      --surface: #1a1f25; --arrow: #7f8995; --hot: #e5e9ee; --focus: #7fb2ec;
      --cmd: #6fa8e0; --evt: #e99a4f; --view: #7fc180; --screen: #e8ecf0; --screen-edge: #8d97a3; --automation: #b9aee4; --sys: #c9dde2; --sys-edge: #6f8e96; --err: #f0776f;
    }
  }
  :root[data-theme="dark"], :host([theme="dark"]) {
    color-scheme: dark;
    --page: #111418; --ink: #e5e9ee; --muted: #98a2ae; --line: #2a3138;
    --board: #171b20; --dot: #262d35; --lane-alt: rgba(229, 233, 238, 0.025); --label-bg: #1c2127;
    --surface: #1a1f25; --arrow: #7f8995; --hot: #e5e9ee; --focus: #7fb2ec;
    --cmd: #6fa8e0; --evt: #e99a4f; --view: #7fc180; --screen: #e8ecf0; --screen-edge: #8d97a3; --automation: #b9aee4; --sys: #c9dde2; --sys-edge: #6f8e96; --err: #f0776f;
  }
  /* Page styles around the boards: used by the board and demo pages, not by <teml-board>. */
  [hidden] { display: none !important; }
  body { background: var(--page); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
  .wrap { padding-inline: 24px; padding-block: 28px 56px; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
  @media (max-width: 600px) { .wrap { padding-inline: 16px; } }
  header { display: grid; gap: 6px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
  h1 { font-family: var(--cond); font-weight: 700; font-size: clamp(28px, 4vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
  .lede { margin: 0; max-width: 68ch; color: var(--muted); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .facts b { color: var(--ink); font-weight: 600; }
  details.src summary { cursor: pointer; font-weight: 600; }
  details.src pre { margin: 12px 0 0; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: auto; max-height: 70vh; font: 12.5px/1.55 var(--mono); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  /* Viewer: a bar across the top, then the editor (with its problems) beside the board. */
  html, body { height: 100%; margin: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
  .brand { display: grid; gap: 0; margin-right: auto; min-width: 0; }
  .brand b { font: 700 20px/1.1 var(--cond); }
  .brand small { font: 12px/1.3 var(--mono); color: var(--muted); overflow-wrap: anywhere; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .controls select, .controls .btn { font: 500 14px var(--sans); color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  .controls .btn:hover, .controls select:hover { border-color: var(--muted); }
  .controls select:focus-visible, textarea:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  #status { font-size: 13px; color: var(--muted); min-height: 1.3em; flex-basis: 100%; }
  #status:empty { display: none; }

  .main { display: grid; grid-template-columns: minmax(300px, 38%) minmax(0, 1fr); min-height: 0; }
  .editor { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; border-right: 1px solid var(--line); background: var(--surface); }
  .code { display: grid; grid-template-columns: auto minmax(0, 1fr); min-height: 0; }
  .code pre, .code textarea { margin: 0; font: 13px/20px var(--mono); padding: 12px 0; tab-size: 2; }
  #gutter { overflow: hidden; padding-inline: 12px 8px; text-align: right; color: var(--muted); background: var(--label-bg); border-right: 1px solid var(--line); user-select: none; font-variant-numeric: tabular-nums; }
  #gutter .bad { color: var(--err); font-weight: 600; }
  #gutter .warn { color: var(--ink); }
  textarea { resize: none; border: 0; padding-inline: 12px; background: var(--surface); color: var(--ink); white-space: pre; overflow: auto; min-width: 0; }
  .problems { border-top: 1px solid var(--line); max-height: min(34vh, 280px); overflow: auto; }
  .problems h2 { font: 600 11px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0; padding: 12px 12px 8px; display: flex; gap: 8px; align-items: baseline; }
  .problems h2 span { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--ink); }
  .problems h2 .err { color: var(--err); }
  .problems ul { list-style: none; margin: 0; padding: 0 0 8px; }
  .problems button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 7ch 3ch minmax(0, 1fr); gap: 10px; padding: 4px 12px; font-size: 13px; line-height: 1.45; }
  .problems button:hover { background: var(--label-bg); }
  .problems button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .problems .ln { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .problems .code-id { font: 600 12px/1.6 var(--mono); color: var(--err); }
  .problems .warning .code-id { color: var(--muted); }
  .problems .where { font-family: var(--mono); color: var(--muted); }
  .board-pane { overflow: auto; padding: 16px; min-width: 0; background: var(--page); }

  body.dragging .app::after { content: "Drop a TEML file to open it"; position: fixed; inset: 12px; display: grid; place-items: center; border: 2px dashed var(--focus); border-radius: 12px; background: color-mix(in srgb, var(--page) 85%, transparent); font: 600 20px var(--cond); color: var(--ink); z-index: 10; pointer-events: none; }

  @media (max-width: 860px) {
    html, body, .app { height: auto; }
    .main { grid-template-columns: minmax(0, 1fr); }
    .editor { height: 65vh; border-right: 0; border-bottom: 1px solid var(--line); }
    .board-pane { overflow: visible; }
  }
</style>

<script>
const D = {"examples":[{"key":"hotel","title":"Hotel (full model)","file":"hotel.teml.yaml","source":"# yaml-language-server: $schema=../schema/teml-alpha-003.schema.json\n#\n# Hotel booking: the classic Event Modeling example (see eventmodeling.org)\n# as a compliant TEML document. It uses every v-alpha-003 feature: actors and\n# screens, change and view slices, automations, an external system that calls\n# our API, and specs.\n\napiVersion: teml.org/v-alpha-003\nmetadata:\n  name: Hotel\n  description: >\n    Guests find and book rooms and pay online. The front desk checks guests in\n    and out, and housekeeping cleans rooms between stays.\n  version: \"0.3.0\"\n\ntypes:\n  - RoomType:\n      enum: [Single, Double, Suite]\n  - BookingStatus:\n      enum: [AwaitingPayment, Confirmed, CheckedIn, CheckedOut, Cancelled]\n\n  # Rows of the list views below. A list of objects uses a named type.\n  - AvailableRoom:\n      roomNumber: s\n      roomType: RoomType\n      nightlyRate: dec\n      bookedNights: date[]\n  - BookingSummary:\n      bookingId: g\n      roomNumber: s\n      checkIn: date\n      checkOut: date\n      total: dec\n      status: BookingStatus\n  - BookingToBill:\n      bookingId: g\n      guestId: g\n      total: dec\n  - BookingToConfirm:\n      bookingId: g\n      guestId: g\n  - RoomToClean:\n      roomNumber: s\n      vacatedAt: dt\n\n# People (the swimlanes at the top of the board) and their screens.\nactors:\n  - Guest:\n      description: Someone booking or staying at the hotel.\n  - Manager:\n      description: Runs the hotel and manages its rooms.\n  - FrontDesk:\n      description: Reception staff who check guests in and out.\n  - Housekeeping:\n      description: Staff who clean rooms between stays.\n\nscreens:\n  - SignUpPage:\n      actor: Guest\n  - RoomSearch:\n      actor: Guest\n      wireframe: wireframes/room-search.png\n  - MyBookings:\n      actor: Guest\n  - RoomManagement:\n      actor: Manager\n  - FrontDeskConsole:\n      actor: FrontDesk\n  - HousekeepingTablet:\n      actor: Housekeeping\n\n# Aggregates\naggs:\n  - GuestAgg:\n      guestId: g\n      name: s\n      email: s\n\n  - RoomAgg:\n      roomNumber: s\n      roomType: RoomType\n      nightlyRate: dec\n      needsCleaning: bool\n\n  - BookingAgg:\n      bookingId: g\n      guestId: g\n      roomNumber: s\n      checkIn: date\n      checkOut: date\n      total: dec\n      status: BookingStatus\n\n# Views\nviews:\n  - RoomAvailability:\n      rooms: AvailableRoom[]\n\n  - GuestBookings:\n      guestId: g\n      guestName: s\n      bookings: BookingSummary[]\n\n  - PaymentsToRequest:\n      pending: BookingToBill[]\n\n  - ConfirmationsToSend:\n      pending: BookingToConfirm[]\n\n  - CleaningSchedule:\n      rooms: RoomToClean[]\n\n# Automations\nautomations:\n  - PaymentRequester:\n      description: Asks the payment provider to charge the guest for each new booking.\n      schedule: every minute\n\n  - ConfirmationEmailer:\n      description: Emails the guest as soon as their booking is confirmed.\n\n# External systems that call our API\nsystems:\n  - PaymentProvider:\n      description: Third-party card payments. Calls POST /webhooks/payments when a charge succeeds.\n\n# Slices (left to right on the timeline)\nslices:\n\n  # ---- Setting up --------------------------------------------------------\n\n  - RegisterGuest:\n      agg: GuestAgg\n      trigger: { screen: SignUpPage }\n      command:\n        RegisterGuest:\n          guestId: g\n          name: s\n          email: s\n      events:\n        - GuestRegistered:\n            guestId: g\n            name: s\n            email: s\n      views:\n        - GuestBookings: [guestId, guestName]\n      status: Completed\n      specs:\n        - name: registers a guest\n          when:\n            RegisterGuest: { guestId: g-1, name: Ada Lovelace, email: ada@example.com }\n          then:\n            - GuestRegistered: { guestId: g-1, name: Ada Lovelace, email: ada@example.com }\n        - name: rejects an email that is already registered\n          given:\n            - GuestRegistered: { guestId: g-1, email: ada@example.com }\n          when:\n            RegisterGuest: { guestId: g-2, email: ada@example.com }\n          then:\n            - error: EmailAlreadyRegistered\n\n  - AddRoom:\n      agg: RoomAgg\n      trigger: { screen: RoomManagement }\n      command:\n        AddRoom:\n          roomNumber: s\n          roomType: RoomType\n          nightlyRate: dec\n      events:\n        - RoomAdded:\n            roomNumber: s\n            roomType: RoomType\n            nightlyRate: dec\n      views:\n        - RoomAvailability: [rooms]\n      status: Completed\n\n  # ---- Booking -------------------------------------------------------------\n\n  # View slice: the guest browses availability before booking.\n  - BrowseRooms:\n      view: RoomAvailability\n      readBy:\n        - screen: RoomSearch\n      status: Completed\n      specs:\n        - name: shows a booked night as taken\n          given:\n            - RoomAdded: { roomNumber: \"101\", roomType: Double, nightlyRate: 120.00 }\n            - RoomBooked: { bookingId: b-1, roomNumber: \"101\", checkIn: 2026-11-02, checkOut: 2026-11-03 }\n          then:\n            - RoomAvailability:\n                rooms:\n                  - { roomNumber: \"101\", roomType: Double, nightlyRate: 120.00, bookedNights: [2026-11-02] }\n\n  - BookRoom:\n      agg: BookingAgg\n      trigger: { screen: RoomSearch }\n      command:\n        BookRoom:\n          bookingId: g\n          guestId: g\n          roomNumber: s\n          checkIn: date\n          checkOut: date\n      events:\n        - RoomBooked:\n            bookingId: g\n            guestId: g\n            roomNumber: s\n            checkIn: date\n            checkOut: date\n            total: dec\n      views:\n        - RoomAvailability: [rooms]\n        - GuestBookings: [bookings]\n        - PaymentsToRequest: [pending]\n      status: InDev\n      story: HOTEL-12\n      specs:\n        - name: books an available room and prices the stay\n          given:\n            - RoomAdded: { roomNumber: \"101\", roomType: Double, nightlyRate: 120.00 }\n          when:\n            BookRoom: { bookingId: b-1, guestId: g-1, roomNumber: \"101\", checkIn: 2026-11-02, checkOut: 2026-11-05 }\n          then:\n            - RoomBooked: { bookingId: b-1, roomNumber: \"101\", checkIn: 2026-11-02, checkOut: 2026-11-05, total: 360.00 }\n        - name: rejects dates that overlap an existing booking\n          given:\n            - RoomAdded: { roomNumber: \"101\" }\n            - RoomBooked: { bookingId: b-1, roomNumber: \"101\", checkIn: 2026-11-02, checkOut: 2026-11-05 }\n          when:\n            BookRoom: { bookingId: b-2, roomNumber: \"101\", checkIn: 2026-11-04, checkOut: 2026-11-06 }\n          then:\n            - error: RoomUnavailable\n\n  # ---- Payment -------------------------------------------------------------\n\n  # View slice: the Payment Requester works from this to-do list.\n  - PaymentTodo:\n      view: PaymentsToRequest\n      readBy:\n        - automation: PaymentRequester\n      status: InDev\n      specs:\n        - name: lists bookings that still need a payment request\n          given:\n            - RoomBooked: { bookingId: b-1, guestId: g-1, total: 360.00 }\n            - RoomBooked: { bookingId: b-2, guestId: g-2, total: 120.00 }\n            - PaymentRequested: { bookingId: b-1 }\n          then:\n            - PaymentsToRequest:\n                pending:\n                  - { bookingId: b-2, guestId: g-2, total: 120.00 }\n\n  # Automation: the requester issues a command for each item on its to-do list.\n  - RequestPayment:\n      agg: BookingAgg\n      trigger: { automation: PaymentRequester }\n      command:\n        RequestPayment:\n          bookingId: g\n          amount: dec\n      events:\n        - PaymentRequested:\n            bookingId: g\n            amount: dec\n            requestedAt: dt\n      views:\n        - PaymentsToRequest: [pending]\n      status: InDev\n      specs:\n        - name: requests payment for a new booking\n          given:\n            - RoomBooked: { bookingId: b-1, total: 360.00 }\n          then:\n            - RequestPayment: { bookingId: b-1, amount: 360.00 }\n        - name: does not request payment twice\n          given:\n            - RoomBooked: { bookingId: b-1, total: 360.00 }\n            - PaymentRequested: { bookingId: b-1 }\n          then: []\n\n  # Translation: the payment provider's webhook calls our API, which issues\n  # RecordPayment. The events are ours, and BookingConfirmed puts the booking\n  # on the Confirmation Emailer's to-do list.\n  - RecordPayment:\n      agg: BookingAgg\n      trigger: { system: PaymentProvider }\n      command:\n        RecordPayment:\n          bookingId: g\n          amount: dec\n          providerReference: s\n      events:\n        - PaymentReceived:\n            bookingId: g\n            amount: dec\n            providerReference: s\n        - BookingConfirmed:\n            bookingId: g\n      views:\n        - GuestBookings: [bookings]\n        - ConfirmationsToSend: [pending]\n      status: Planned\n      specs:\n        - name: records the payment and confirms the booking\n          given:\n            - RoomBooked: { bookingId: b-1, total: 360.00 }\n            - PaymentRequested: { bookingId: b-1, amount: 360.00 }\n          when:\n            RecordPayment: { bookingId: b-1, amount: 360.00, providerReference: pay_123 }\n          then:\n            - PaymentReceived: { bookingId: b-1, amount: 360.00, providerReference: pay_123 }\n            - BookingConfirmed: { bookingId: b-1 }\n        - name: rejects a payment for an unknown booking\n          when:\n            RecordPayment: { bookingId: b-9, amount: 50.00, providerReference: pay_999 }\n          then:\n            - error: UnknownBooking\n\n  # View slice: the Confirmation Emailer works from this to-do list.\n  - ConfirmationTodo:\n      view: ConfirmationsToSend\n      readBy:\n        - automation: ConfirmationEmailer\n      status: Planned\n      specs:\n        - name: lists confirmed bookings that have not been emailed\n          given:\n            - RoomBooked: { bookingId: b-1, guestId: g-1 }\n            - BookingConfirmed: { bookingId: b-1 }\n          then:\n            - ConfirmationsToSend:\n                pending:\n                  - { bookingId: b-1, guestId: g-1 }\n\n  # Automation: the emailer issues a command for each item on its to-do list.\n  - SendBookingConfirmation:\n      agg: BookingAgg\n      trigger: { automation: ConfirmationEmailer }\n      command:\n        SendConfirmationEmail:\n          bookingId: g\n      events:\n        - ConfirmationEmailSent:\n            bookingId: g\n            sentAt: dt\n      views:\n        - ConfirmationsToSend: [pending]\n      status: Planned\n      specs:\n        - name: emails the guest once the booking is confirmed\n          given:\n            - BookingConfirmed: { bookingId: b-1 }\n          then:\n            - SendConfirmationEmail: { bookingId: b-1 }\n\n  # ---- Managing a booking --------------------------------------------------\n\n  # View slice: one view, read on two screens by two different actors.\n  - ShowBookings:\n      view: GuestBookings\n      readBy:\n        - screen: MyBookings\n        - screen: FrontDeskConsole\n      status: Planned\n      specs:\n        - name: shows a confirmed booking\n          given:\n            - GuestRegistered: { guestId: g-1, name: Ada Lovelace }\n            - RoomBooked: { bookingId: b-1, guestId: g-1, roomNumber: \"101\", total: 360.00 }\n            - BookingConfirmed: { bookingId: b-1 }\n          then:\n            - GuestBookings:\n                guestId: g-1\n                guestName: Ada Lovelace\n                bookings:\n                  - { bookingId: b-1, roomNumber: \"101\", total: 360.00, status: Confirmed }\n\n  - CancelBooking:\n      agg: BookingAgg\n      trigger: { screen: MyBookings }\n      command:\n        CancelBooking:\n          bookingId: g\n          reason: s?\n      events:\n        - BookingCancelled:\n            bookingId: g\n            reason: s?\n      views:\n        - RoomAvailability: [rooms]\n        - GuestBookings: [bookings]\n      status: Planned\n      specs:\n        - name: cannot cancel after check-in\n          given:\n            - RoomBooked: { bookingId: b-1 }\n            - GuestCheckedIn: { bookingId: b-1 }\n          when:\n            CancelBooking: { bookingId: b-1 }\n          then:\n            - error: AlreadyCheckedIn\n\n  # ---- The stay ----------------------------------------------------------\n\n  - CheckIn:\n      agg: BookingAgg\n      trigger: { screen: FrontDeskConsole }\n      command:\n        CheckIn:\n          bookingId: g\n      events:\n        - GuestCheckedIn:\n            bookingId: g\n            roomNumber: s\n            checkedInAt: dt\n      views:\n        - GuestBookings: [bookings]\n      status: Planned\n      specs:\n        - name: cannot check in before payment is confirmed\n          given:\n            - RoomBooked: { bookingId: b-1 }\n          when:\n            CheckIn: { bookingId: b-1 }\n          then:\n            - error: PaymentNotConfirmed\n\n  - CheckOut:\n      agg: BookingAgg\n      trigger: { screen: FrontDeskConsole }\n      command:\n        CheckOut:\n          bookingId: g\n      events:\n        - GuestCheckedOut:\n            bookingId: g\n            roomNumber: s\n            checkedOutAt: dt\n      views:\n        - GuestBookings: [bookings]\n        - CleaningSchedule: [rooms]\n      status: Planned\n\n  # ---- Housekeeping --------------------------------------------------------\n\n  - CleaningList:\n      view: CleaningSchedule\n      readBy:\n        - screen: HousekeepingTablet\n      status: Planned\n\n  - MarkRoomCleaned:\n      agg: RoomAgg\n      trigger: { screen: HousekeepingTablet }\n      command:\n        MarkRoomCleaned:\n          roomNumber: s\n      events:\n        - RoomCleaned:\n            roomNumber: s\n            cleanedAt: dt\n      views:\n        - CleaningSchedule: [rooms]\n      status: Planned\n"},{"key":"actors","title":"Actors and screens","file":"features/actors-and-screens.teml.yaml","source":"# yaml-language-server: $schema=../../schema/teml-alpha-003.schema.json\n#\n# Feature demo: actors and screens (spec §10).\n# Each actor gets a swimlane at the top of the board, and their screens sit in it.\n\napiVersion: teml.org/v-alpha-003\nmetadata:\n  name: Coffee shop orders\n  description: A customer orders at a kiosk; a barista makes the drink.\n\nactors:\n  - Customer:\n      description: Orders drinks at the kiosk.\n  - Barista:\n      description: Makes the drinks.\n\nscreens:\n  - OrderKiosk:\n      actor: Customer\n  - BaristaTablet:\n      actor: Barista\n\naggs:\n  - OrderAgg:\n      orderId: g\n      drink: s\n      customerName: s\n      status: s\n\nslices:\n  - PlaceOrder:\n      agg: OrderAgg\n      trigger: { screen: OrderKiosk }          # the Customer's screen\n      command:\n        PlaceOrder: { orderId: g, drink: s, customerName: s }\n      events:\n        - OrderPlaced: { orderId: g, drink: s, customerName: s }\n\n  - StartOrder:\n      agg: OrderAgg\n      trigger: { screen: BaristaTablet }       # the Barista's screen\n      command:\n        StartOrder: { orderId: g }\n      events:\n        - OrderStarted: { orderId: g, startedAt: dt }\n\n  - CompleteOrder:\n      agg: OrderAgg\n      trigger: { screen: BaristaTablet }       # same screen, another command\n      command:\n        CompleteOrder: { orderId: g }\n      events:\n        - OrderCompleted: { orderId: g, completedAt: dt }\n"},{"key":"views","title":"View slices","file":"features/view-slices.teml.yaml","source":"# yaml-language-server: $schema=../../schema/teml-alpha-003.schema.json\n#\n# Feature demo: view slices (spec §12.6).\n# A view slice shows where a read model is read: on screens, or by an\n# automation that works from it as a to-do list.\n\napiVersion: teml.org/v-alpha-003\nmetadata:\n  name: Coffee shop pickup\n  description: Baristas work from a queue, customers track their order, and an automation texts customers when a drink is ready.\n\nactors:\n  - Customer:\n  - Barista:\n\nscreens:\n  - OrderKiosk:\n      actor: Customer\n  - OrderStatusPage:\n      actor: Customer\n  - BaristaTablet:\n      actor: Barista\n\ntypes:\n  - QueuedOrder:\n      orderId: g\n      drink: s\n      customerName: s\n  - TextToSend:\n      orderId: g\n      phone: s\n\naggs:\n  - OrderAgg:\n      orderId: g\n      drink: s\n      phone: s\n      status: s\n\nviews:\n  - OrderQueue:\n      orders: QueuedOrder[]\n\n  - OrderStatus:\n      orderId: g\n      drink: s\n      status: s\n\n  - ReadyToNotify:\n      pending: TextToSend[]\n\nautomations:\n  - ReadyNotifier:\n      description: Texts the customer when their drink is ready.\n\nslices:\n  - PlaceOrder:\n      agg: OrderAgg\n      trigger: { screen: OrderKiosk }\n      command:\n        PlaceOrder: { orderId: g, drink: s, customerName: s, phone: s }\n      events:\n        - OrderPlaced: { orderId: g, drink: s, customerName: s, phone: s }\n      views:\n        - OrderQueue: [orders]\n        - OrderStatus: [orderId, drink, status]\n\n  # View slice read by a screen: the barista's queue.\n  - ShowQueue:\n      view: OrderQueue\n      readBy:\n        - screen: BaristaTablet\n      specs:\n        - name: lists orders that are not finished yet\n          given:\n            - OrderPlaced: { orderId: o-1, drink: Latte, customerName: Ada }\n            - OrderPlaced: { orderId: o-2, drink: Mocha, customerName: Grace }\n            - OrderCompleted: { orderId: o-1 }\n          then:\n            - OrderQueue:\n                orders:\n                  - { orderId: o-2, drink: Mocha, customerName: Grace }\n\n  - CompleteOrder:\n      agg: OrderAgg\n      trigger: { screen: BaristaTablet }\n      command:\n        CompleteOrder: { orderId: g }\n      events:\n        - OrderCompleted: { orderId: g, completedAt: dt }\n      views:\n        - OrderQueue: [orders]\n        - OrderStatus: [status]\n        - ReadyToNotify: [pending]\n\n  # View slice read by two screens, used by two different actors.\n  - TrackOrder:\n      view: OrderStatus\n      readBy:\n        - screen: OrderStatusPage\n        - screen: BaristaTablet\n      specs:\n        - name: shows the order as ready once it is completed\n          given:\n            - OrderPlaced: { orderId: o-1, drink: Latte }\n            - OrderCompleted: { orderId: o-1 }\n          then:\n            - OrderStatus: { orderId: o-1, drink: Latte, status: Ready }\n\n  # View slice read by an automation: its to-do list.\n  - NotifyTodo:\n      view: ReadyToNotify\n      readBy:\n        - automation: ReadyNotifier\n      specs:\n        - name: lists completed orders whose customer has not been texted\n          given:\n            - OrderPlaced: { orderId: o-1, phone: \"+1 555 0100\" }\n            - OrderCompleted: { orderId: o-1 }\n          then:\n            - ReadyToNotify:\n                pending:\n                  - { orderId: o-1, phone: \"+1 555 0100\" }\n\n  - NotifyCustomer:\n      agg: OrderAgg\n      trigger: { automation: ReadyNotifier }\n      command:\n        SendReadyText: { orderId: g, phone: s }\n      events:\n        - CustomerNotified: { orderId: g, notifiedAt: dt }\n      views:\n        - ReadyToNotify: [pending]\n"},{"key":"systems","title":"External system","file":"features/external-system.teml.yaml","source":"# yaml-language-server: $schema=../../schema/teml-alpha-003.schema.json\n#\n# Feature demo: an external system that calls our API (spec §11).\n# The payment provider can't add events to our model. Its webhook calls our\n# API, which issues our ConfirmPayment command. The PaymentConfirmed event is\n# ours, and it puts the order on our ReceiptSender automation's to-do list.\n\napiVersion: teml.org/v-alpha-003\nmetadata:\n  name: Online shop checkout\n  description: A shopper pays by card; the payment provider confirms the charge through a webhook.\n\nactors:\n  - Shopper:\n\nscreens:\n  - CheckoutPage:\n      actor: Shopper\n  - OrderConfirmationPage:\n      actor: Shopper\n\nsystems:\n  - PaymentProvider:\n      description: Card payments. Calls POST /webhooks/payments when a charge succeeds.\n\naggs:\n  - OrderAgg:\n      orderId: g\n      amount: dec\n      status: s\n\nviews:\n  - OrderSummary:\n      orderId: g\n      amount: dec\n      status: s\n\n  - ReceiptsToSend:\n      orderIds: g[]\n\nautomations:\n  - ReceiptSender:\n      description: Emails a receipt once a payment is confirmed.\n\nslices:\n  - Checkout:\n      agg: OrderAgg\n      trigger: { screen: CheckoutPage }\n      command:\n        Checkout: { orderId: g, amount: dec }\n      events:\n        - CheckoutStarted: { orderId: g, amount: dec }\n      views:\n        - OrderSummary: [orderId, amount, status]\n\n  # The provider's webhook calls our API, which issues this command.\n  - ConfirmPayment:\n      agg: OrderAgg\n      trigger: { system: PaymentProvider }\n      command:\n        ConfirmPayment: { orderId: g, amount: dec, providerReference: s }\n      events:\n        - PaymentConfirmed: { orderId: g, amount: dec, providerReference: s }\n      views:\n        - OrderSummary: [status]\n        - ReceiptsToSend: [orderIds]          # our event goes on our automation's to-do list\n      specs:\n        - name: confirms the payment\n          given:\n            - CheckoutStarted: { orderId: o-1, amount: 42.00 }\n          when:\n            ConfirmPayment: { orderId: o-1, amount: 42.00, providerReference: ch_123 }\n          then:\n            - PaymentConfirmed: { orderId: o-1, amount: 42.00, providerReference: ch_123 }\n        - name: rejects a charge for the wrong amount\n          given:\n            - CheckoutStarted: { orderId: o-1, amount: 42.00 }\n          when:\n            ConfirmPayment: { orderId: o-1, amount: 4.20, providerReference: ch_124 }\n          then:\n            - error: AmountMismatch\n\n  - ShowOrder:\n      view: OrderSummary\n      readBy:\n        - screen: OrderConfirmationPage\n\n  # View slice: the ReceiptSender works from this to-do list.\n  - ReceiptTodo:\n      view: ReceiptsToSend\n      readBy:\n        - automation: ReceiptSender\n\n  - SendReceipt:\n      agg: OrderAgg\n      trigger: { automation: ReceiptSender }\n      command:\n        SendReceipt: { orderId: g }\n      events:\n        - ReceiptSent: { orderId: g, sentAt: dt }\n      views:\n        - ReceiptsToSend: [orderIds]\n      specs:\n        - name: sends a receipt once the payment is confirmed\n          given:\n            - PaymentConfirmed: { orderId: o-1 }\n          then:\n            - SendReceipt: { orderId: o-1 }\n"},{"key":"user","title":"User (compliant)","file":"user-compliant.teml.yaml","source":"# yaml-language-server: $schema=../schema/teml-alpha-003.schema.json\n#\n# The \"Simple Example\" from teml.org as a compliant TEML document, extended\n# with an automation and Given/When/Then specs.\n\napiVersion: teml.org/v-alpha-003\nmetadata:\n  name: sample\n  description: Adding users, keeping their details current, and welcoming them by email.\n\nscreens:\n  - AddUserForm:\n  - UserList:\n\ntypes:\n  - PendingEmail:\n      id: g\n      email: s\n\nautomations:\n  - WelcomeEmailer:\n      description: Sends a welcome email to each newly added user.\n      schedule: every minute\n\naggs:\n  - UserAgg:\n      id: g\n      firstName: s\n      lastName: s\n      age: int\n      email: s\n\nviews:\n  - UserView:\n      id: g\n      firstName: s\n      lastName: s\n      age: int\n\n  - PendingWelcomeEmails:     # the automation's to-do list\n      pending: PendingEmail[]\n\n# Slices (left to right on the timeline)\nslices:\n  - AddUser:\n      agg: UserAgg\n      trigger: { screen: AddUserForm }\n      command:\n        AddUser:\n          id: g\n          firstName: s\n          lastName: s\n          age: int\n          email: s\n      events:\n        - AddedUser:\n            id: g\n            firstName: s\n            lastName: s\n            age: int\n            email: s\n      views:\n        - UserView\n        - PendingWelcomeEmails: [pending]\n      status: Completed\n      specs:\n        - name: adds a new user\n          when:\n            AddUser: { id: u-1, firstName: Ada, lastName: Lovelace, age: 36, email: ada@example.com }\n          then:\n            - AddedUser: { id: u-1, firstName: Ada, lastName: Lovelace, age: 36, email: ada@example.com }\n        - name: rejects a duplicate id\n          given:\n            - AddedUser: { id: u-1 }\n          when:\n            AddUser: { id: u-1 }\n          then:\n            - error: UserAlreadyExists\n\n  # No command given: it is inferred as \"RenameUser\" with unspecified props.\n  - RenameUser:\n      agg: UserAgg\n      events:\n        - RenamedUser:\n            id: g\n            firstName: s\n            lastName: s\n      views:\n        - UserView: [id, firstName, lastName]\n      status: Completed\n\n  - ReAgeUser:\n      story: \"https://www.example.com/12345\"\n      status: InDev\n      agg: UserAgg\n      events:\n        - ReAgedUser:\n            id: g\n            age: int\n      views:\n        - UserView: [id, age]\n\n  - ShowUsers:\n      view: UserView\n      readBy:\n        - screen: UserList\n      status: Completed\n\n  # View slice: the WelcomeEmailer works from this to-do list.\n  - WelcomeTodo:\n      view: PendingWelcomeEmails\n      readBy:\n        - automation: WelcomeEmailer\n      status: InDev\n\n  # Automation: the WelcomeEmailer issues this slice's command.\n  - SendWelcomeEmail:\n      agg: UserAgg\n      trigger: { automation: WelcomeEmailer }\n      command:\n        SendWelcomeEmail:\n          id: g\n          email: s\n      events:\n        - SentWelcomeEmail:\n            id: g\n            sentAt: dt\n      views:\n        - PendingWelcomeEmails: [pending]\n      status: InDev\n      specs:\n        - name: emails a newly added user\n          given:\n            - AddedUser: { id: u-1, email: ada@example.com }\n          then:\n            - SendWelcomeEmail: { id: u-1, email: ada@example.com }\n        - name: does not email the same user twice\n          given:\n            - AddedUser: { id: u-1, email: ada@example.com }\n            - SentWelcomeEmail: { id: u-1 }\n          then: []\n"},{"key":"sketch","title":"User (sketch)","file":"user-sketch.teml.yaml","source":"# A TEML sketch: no header and no types. It records just enough for the team\n# to talk about the model. This is the \"skimmed down\" style from teml.org,\n# written so that it is valid YAML.\n\naggs:\n  - UserAgg: [id, firstName, lastName, age]\n\nviews:\n  - UserView: [id, firstName, lastName, age]\n\nslices:\n  # The command is left out; it is inferred as \"AddUser\" from the slice name.\n  - AddUser:\n      events:\n        - AddedUser: [id, firstName, lastName, age]\n      views: [UserView]\n\n  - RenameUser:\n      events:\n        - RenamedUser: [id, firstName, lastName]\n      views:\n        - UserView: [firstName, lastName]\n\n  - ReAgeUser:\n      events: [ReAgedUser]\n      views:\n        - UserView: [age]\n"}]};
const $ = id => document.getElementById(id);
const src = $("src"), gutter = $("gutter"), board = $("board"), list = $("problems"), summary = $("summary"), status = $("status"), examples = $("examples");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let marks = new Map(), modified = false, timer = 0;

D.examples.forEach(e => examples.add(new Option(e.title, e.key)));
const say = text => { status.textContent = text; };

// ---- the editor: line numbers that scroll with the text, marked where there are problems ----
function drawGutter() {
  const n = src.value.split("\n").length;
  let html = "";
  for (let i = 1; i <= n; i++) html += marks.has(i) ? `<span class="${marks.get(i)}">${i}</span>\n` : i + "\n";
  gutter.innerHTML = html;
  gutter.scrollTop = src.scrollTop;
}
src.addEventListener("scroll", () => { gutter.scrollTop = src.scrollTop; });
src.addEventListener("input", () => {
  modified = true;
  drawGutter();
  clearTimeout(timer);
  timer = setTimeout(draw, 250);
});

// The board keeps its last good drawing when the YAML stops parsing.
function draw() { board.source = src.value; }

board.addEventListener("teml-load", e => {
  const { model, problems } = e.detail;
  marks = new Map();
  for (const p of problems) if (p.line && marks.get(p.line) !== "bad") marks.set(p.line, p.level === "error" ? "bad" : "warn");
  drawGutter();
  const n = l => problems.filter(p => p.level === l).length, errors = n("error"), warnings = n("warning");
  const count = (c, w) => c ? `${c} ${w}${c > 1 ? "s" : ""}` : "";
  const yamlBroken = problems.some(p => p.code === "YAML");
  summary.className = errors ? "err" : "";
  summary.textContent = (problems.length ? [count(errors, "error"), count(warnings, "warning")].filter(Boolean).join(", ") : "none")
    + (yamlBroken && model ? " · the board shows the last version that parsed" : "");
  list.innerHTML = problems.map((p, i) => `<li class="${p.level}"><button type="button" data-i="${i}"><span class="ln">${p.line ? "line " + p.line : ""}</span>`
    + `<span class="code-id">${esc(p.code)}</span><span>${esc(p.message)}${p.where ? ` <span class="where">${esc(p.where)}</span>` : ""}</span></button></li>`).join("");
  list.onclick = ev => { const b = ev.target.closest("button"); const p = b && problems[+b.dataset.i]; if (p?.line) jump(p.line, p.col ?? 1); };
  if (model?.metadata?.name) $("docname").textContent = `${model.metadata.name} · ${model.apiVersion ?? "sketch"}`;
});

function jump(line, col) {
  const lines = src.value.split("\n");
  const at = lines.slice(0, line - 1).reduce((a, l) => a + l.length + 1, 0) + Math.max(0, col - 1);
  src.focus({ preventScroll: true });
  src.setSelectionRange(at, at);
  src.scrollTop = Math.max(0, (line - 1) * 20 - src.clientHeight / 3);
  gutter.scrollTop = src.scrollTop;
  if (matchMedia("(max-width: 860px)").matches) src.scrollIntoView({ block: "nearest" });
}

function load(text, from) {
  src.value = text.replace(/\r\n?/g, "\n");
  src.scrollTop = 0;
  modified = false;
  drawGutter();
  draw();
  say(from ? `Opened ${from}.` : "");
}
const keepEdits = () => !modified || confirm("Replace your edits? They aren't saved anywhere.");

// ---- ways in: examples, a file, drag and drop, ?src=<url>, and a share link (#m=…) ----
examples.addEventListener("change", () => {
  const ex = D.examples.find(e => e.key === examples.value);
  if (ex && keepEdits()) load(ex.source, ex.file);
  examples.value = "";
});
$("open").addEventListener("click", () => $("file").click());
async function openFile(f) {
  if (!f || !keepEdits()) return;
  try { load(await f.text(), f.name); } catch { say(`Couldn't read ${f.name}.`); }
}
$("file").addEventListener("change", e => { openFile(e.target.files[0]); e.target.value = ""; });
let depth = 0;
addEventListener("dragenter", e => { if (e.dataTransfer?.types.includes("Files")) { depth++; document.body.classList.add("dragging"); } });
addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); depth = 0; document.body.classList.remove("dragging"); openFile(e.dataTransfer?.files[0]); });

// A share link carries the whole model, compressed, in the URL hash, so it never reaches a server.
const toB64 = bytes => btoa(Array.from(bytes, b => String.fromCharCode(b)).join("")).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const fromB64 = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0));
const pipe = (data, stream) => new Response(new Blob([data]).stream().pipeThrough(stream));
const pack = async text => toB64(new Uint8Array(await pipe(text, new CompressionStream("deflate-raw")).arrayBuffer()));
const unpack = async s => pipe(fromB64(s), new DecompressionStream("deflate-raw")).text();

$("share").addEventListener("click", async () => {
  const url = `${location.origin}${location.pathname}#m=${await pack(src.value)}`;
  history.replaceState(null, "", url);
  modified = false;
  say("The share link is in the address bar. It holds the whole model, so later edits need a new link.");
  try { await navigator.clipboard.writeText(url); say(`Link copied (${(url.length / 1024).toFixed(1)} KB). It holds the whole model, so later edits need a new link.`); }
  catch { /* the address bar message stands */ }
});

async function fromLocation() {
  const m = location.hash.match(/^#m=(.*)$/);
  if (m) {
    try { return load(await unpack(m[1]), "a shared link"); }
    catch { say("That share link is damaged, so the hotel example is shown instead."); }
  }
  const url = new URLSearchParams(location.search).get("src");
  if (url && !m) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`.trim());
      return load(await res.text(), url.split("/").pop() || url);
    } catch (e) { say(`Couldn't load ${url} (${e.message}). That server may not allow other sites to read it. The hotel example is shown instead.`); }
  }
  const msg = status.textContent;
  load(D.examples.find(e => e.key === "hotel").source);
  say(msg);
}
addEventListener("hashchange", () => { if (/^#m=/.test(location.hash) && keepEdits()) fromLocation(); });
fromLocation();
</script>
