apiVersion: teml.org/v-alpha-003
metadata:
  name: Library

actors:
  - Librarian:
  - Member:

screens:
  - Catalogue:
      actor: Librarian
  - BookSearch:
      actor: Member
  - LoanDesk:
      actor: Librarian

aggs:
  - BookAgg:
      bookId: g
      title: s
      onLoan: bool

views:
  - BookList:
      bookId: g
      title: s

slices:
  - AddBook:
      agg: BookAgg
      trigger: { screen: Catalogue }
      command:
        AddBook: { bookId: g, title: s }
      events:
        - BookAdded: { bookId: g, title: s }
      views: [BookList]

  - BrowseBooks:
      view: BookList
      readBy:
        - screen: BookSearch

  - LendBook:
      agg: BookAgg
      trigger: { screen: LoanDesk }
      command:
        LendBook: { bookId: g, loanId: g, memberId: g }
      events:
        - BookLent: { bookId: g, loanId: g, memberId: g }
