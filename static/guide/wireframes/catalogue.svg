<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Catalogue: adding a book</title>
  <rect width="480" height="300" fill="#f7f7f7" stroke="#999"/>
  <rect width="480" height="36" fill="#555"/>
  <text x="14" y="23" fill="#fff" font-weight="bold">Riverside Library · Catalogue</text>
  <text x="400" y="23" fill="#ddd">Ana Ruiz</text>
  <text x="16" y="62" font-size="15" font-weight="bold">Add a book</text>
  <text x="16" y="88" fill="#666" font-size="11">Title</text><rect x="16" y="94" width="300" height="28" fill="#fff" stroke="#888"/><text x="26" y="113">The Left Hand of Darkness</text>
  <text x="16" y="142" fill="#666" font-size="11">Author</text><rect x="16" y="148" width="300" height="28" fill="#fff" stroke="#888"/><text x="26" y="167">Ursula K. Le Guin</text>
  <text x="16" y="196" fill="#666" font-size="11">Shelf</text><rect x="16" y="202" width="140" height="28" fill="#fff" stroke="#888"/><text x="26" y="221">SF · LEG ▾</text>
  <rect x="16" y="250" width="96" height="28" rx="3" fill="#555"/><text x="34" y="269" fill="#fff" font-weight="bold">Add book</text>
  <rect x="336" y="94" width="128" height="184" fill="#fff" stroke="#ccc"/><text x="348" y="114" fill="#666" font-size="11">Added today</text>
  <text x="348" y="138" font-size="11">Kindred</text><text x="348" y="158" font-size="11">Piranesi</text><text x="348" y="178" font-size="11">Middlemarch</text>
