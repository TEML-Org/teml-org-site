actors:
  - Librarian:
  - Member:

screens:
  - Catalogue:
      actor: Librarian
  - BookSearch:
      actor: Member
  - LoanDesk:
      actor: Librarian

aggs:
  - BookAgg: [bookId, title, onLoan]

views:
  - BookList: [bookId, title]

slices:
  - AddBook:
      agg: BookAgg
      trigger: { screen: Catalogue }
      events:
        - BookAdded: [bookId, title]
      views: [BookList]

  - BrowseBooks:
      view: BookList
      readBy:
        - screen: BookSearch

  - LendBook:
      agg: BookAgg
      trigger: { screen: LoanDesk }
      events:
        - BookLent: [bookId, loanId, memberId]
